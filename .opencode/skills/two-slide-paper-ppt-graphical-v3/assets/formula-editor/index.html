<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学术 PPT 公式编辑器</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">LATEX → SVG → PPTX</p><h1>学术 PPT 公式编辑器</h1><p>只替换清单中命名的公式对象，其他页面内容保持不变。</p></div><span id="status">加载中</span></header><section><aside id="list"></aside><article><label>LaTeX 源码<textarea id="latex" spellcheck="false"></textarea></label><div class="actions"><button id="preview">刷新预览</button><button id="build">生成新 PPTX</button></div><div id="svg" class="preview"></div><details><summary>文件设置</summary><label>源 PPTX<input id="source"></label><label>输出 PPTX<input id="output"></label></details><pre id="log"></pre></article></section></main><script src="app.js"></script></body></html>
