[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-dispatch-optimization-skill"
version = "0.1.0"
description = "Configurable power-system dispatch optimization Skill and Web-Agent orchestration package"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20", "pandas>=2.0", "numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
